[project]
name = "cbackup"
version = "0.1.0"
description = "Confluence Cloud -> OKF Markdown backup"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "lxml>=5.2"]

[project.scripts]
cbackup = "cbackup.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pyyaml>=6.0"]  # pyyaml validates our hand-rolled frontmatter

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cbackup"]

[tool.pytest.ini_options]
markers = ["live: hits the real Confluence API; needs credentials; skipped by default"]
addopts = "-m 'not live'"
